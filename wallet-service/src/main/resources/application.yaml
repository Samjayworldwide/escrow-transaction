server:
  port: 8084

spring:
  application:
    name: wallet-service
  config:
    import: optional:/Users/mac/escrow_project/wallet-service/.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
          jwk-set-uri: http://localhost:8080/oauth2/jwks

  cloud:
    function:
      definition: createUserWallet;createUserWalletDlq;creditWalletOnPaymentCompletion;creditWalletOnPaymentCompletionDlq;releasePaymentOnOrderSettlement;releasePaymentOnOrderSettlementDlq;creditDriverOnDeliveryCompletion;creditDriverOnDeliveryCompletionDlq
    stream:
      bindings:
        createUserWallet-in-0:
          destination: user-registered
          group: ${spring.application.name}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
        creditWalletOnPaymentCompletion-in-0:
          destination: payment-completed
          group: ${spring.application.name}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
        releasePaymentOnOrderSettlement-in-0:
          destination: order-settled
          group: ${spring.application.name}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
        creditDriverOnDeliveryCompletion-in-0:
          destination: delivery-completed
          group: ${spring.application.name}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
        driverSearchBinding-out-0:
          destination: driver-search
          producer:
            error-channel-enabled: true
        escrowReleaseCompletedBinding-out-0:
          destination: escrow-release-completed
          producer:
            error-channel-enabled: true
        driverWalletCreditNotificationBinding-out-0:
          destination: driver-wallet-credited
          producer:
            error-channel-enabled: true
        createUserWalletDlq-in-0:
          destination: create-user-wallet.DLQ
          group: ${spring.application.name}-creation-dlq
        creditWalletOnPaymentCompletionDlq-in-0:
          destination: credit-wallet-on-payment-completion.DLQ
          group: ${spring.application.name}-credit-dlq
        releasePaymentOnOrderSettlementDlq-in-0:
          destination: release-payment-on-order-settlement.DLQ
          group: ${spring.application.name}-release-dlq
        creditDriverOnDeliveryCompletionDlq-in-0:
          destination: credit-driver-on-delivery-completion.DLQ
          group: ${spring.application.name}-credit-driver-dlq
      kafka:
        binder:
          brokers:
            - localhost:9092
          producer-properties:
            retries: 3
            retry.backoff.ms: 1000
            acks: all
            enable.idempotence: true
            max.in.flight.requests.per.connection: 5
            delivery.timeout.ms: 30000
            request.timeout.ms: 10000
        bindings:
          createUserWallet-in-0:
            consumer:
              enable-dlq: true
              dlq-name: create-user-wallet.DLQ
          creditWalletOnPaymentCompletion-in-0:
            consumer:
              enable-dlq: true
              dlq-name: credit-wallet-on-payment-completion.DLQ
          releasePaymentOnOrderSettlement-in-0:
            consumer:
              enable-dlq: true
              dlq-name: release-payment-on-order-settlement.DLQ
          creditDriverOnDeliveryCompletion-in-0:
            consumer:
              enable-dlq: true
              dlq-name: credit-driver-on-delivery-completion.DLQ

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    outbox:
      enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.samjay: TRACE

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8082/eureka/

outbox:
  poll:
    pending-interval-ms: 5000
    retry-interval-ms: 60000
    cleanup-interval-ms: 3600000
    batch-size: 50
    backoff-multiplier-seconds: 30
    cleanup-retention-hours: 24